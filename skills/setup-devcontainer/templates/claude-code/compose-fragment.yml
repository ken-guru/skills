  claude-code:
    image: {{REPO_NAME}}-claude-code:{{BASE_IMAGE_VERSION}}-{{BASE_IMAGE_HASH12}}
    env_file:
      - .env
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
    volumes:
      - {{REPO_NAME}}-claude-code-checkout:/workspace
      - {{REPO_NAME}}-claude-code-config:/home/vscode/.claude
    command: sleep infinity
