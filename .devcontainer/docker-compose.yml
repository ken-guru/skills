# Generated by setup-devcontainer. One service per selected Tool Container —
# see SKILL.md's compose-assembly step. Each service mounts its own Private
# Checkout (a named volume populated by onCreateCommand's clone script, not
# a bind mount of the host's repo) and can run concurrently: open each
# tool's own devcontainer.json in a separate VS Code window (File > New
# Window + Reopen in Container).
services:
  claude-code:
    image: skills-claude-code:v3-3adc81359b62
    env_file:
      - .env
    environment:
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # Untried fix for a real-world failure of #234's npm-based install and
      # pinning: Anthropic's own VS Code extension docs (code.claude.com/
      # docs/en/vs-code) say running `claude` in a VS Code integrated
      # terminal auto-installs a *separate* native build and, per live
      # observation, appears to make Claude Code report and run from that
      # native install instead of the npm one this container just set up —
      # silently defeating the pin (confirmed live: a version pinned to
      # 2.1.260 via npm showed as 2.1.267/native inside a real VS Code Dev
      # Containers session, though the exact causal mechanism isn't fully
      # confirmed — see #235's research). Set as a container-level env var,
      # not just during install, since it needs to be present in every VS
      # Code integrated terminal this extension might auto-trigger from, not
      # only during postCreateCommand.
      CLAUDE_CODE_IDE_SKIP_AUTO_INSTALL: "1"
    volumes:
      - skills-claude-code-checkout:/workspace
      - skills-claude-code-config:/home/vscode/.claude
    command: sleep infinity
  codex:
    image: skills-codex:v3-3adc81359b62
    env_file:
      - .env
    environment:
      CODEX_HOME: /home/vscode/.codex
    # Codex's Linux sandbox uses Bubblewrap, which needs to create an
    # unprivileged user namespace — scoped to Codex's own service only (no
    # other Tool Container's service carries this grant). Two distinct
    # causes, not one grant for one reason:
    # - SYS_ADMIN + seccomp=unconfined satisfy Docker's own default
    #   seccomp/OCI policy for creating that namespace inside an already-
    #   containerized environment. This is not bubblewrap's own stated
    #   minimum requirement: bubblewrap's modern (non-setuid) mode doesn't
    #   itself need SYS_ADMIN — Docker's default seccomp profile is what
    #   gates clone/unshare/mount behind that capability at
    #   container-creation time.
    # - systempaths=unconfined is Moby's MaskedPaths/ReadonlyPaths OCI
    #   mechanism (not an AppArmor-only setting, despite the name reading
    #   that way) — it fixes a distinct /proc-remount failure bubblewrap
    #   hits under Docker's default masked/read-only path set, unrelated to
    #   the seccomp/capability issue above.
    # A narrower grant (a custom seccomp allowlist instead of `unconfined`,
    # dropping SYS_ADMIN once that allowlist exists) is plausible but
    # unverified by any primary source as of this writing — not changed
    # here without empirical testing against Codex's actual sandboxed
    # command set, since a wrong guess would silently break the sandbox
    # rather than fail loudly. See README.baseline.md's "CLI installer
    # notes" section for the reader-facing version of this.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    volumes:
      - skills-codex-checkout:/workspace
      - skills-codex-config:/home/vscode/.codex
    command: sleep infinity

volumes:
  skills-claude-code-config:
  skills-claude-code-checkout:
  skills-codex-config:
  skills-codex-checkout:
