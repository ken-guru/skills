name: Release units

# Collection-level check that every Release Unit's versions, frontmatter and
# release-please registration agree. Cheap and path-independent, so it runs on
# every PR and push: a required check must always report.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-units-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-units:
    name: release-units
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the release-unit check
        run: node --test scripts/release-units/*.test.mjs

      # On a PR, also warn (never fail) about its commits: non-releasing types
      # touching shipped Skill files, and breaking commits without an upgrade note.
      - name: Check release units
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/release-units/check-release-units.mjs --commits "$BASE_SHA..$HEAD_SHA"
          else
            node scripts/release-units/check-release-units.mjs
          fi
