name: Presentation rendered acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: presentation-theme-rendering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-acceptance:
    name: Presentation rendered acceptance
    # The approved visual baselines use the bundled macOS offline-safe fonts.
    runs-on: macos-15
    timeout-minutes: 20

    defaults:
      run:
        working-directory: skills/presentation/verification/presentation-themes

    env:
      PRESENTATION_THEME_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      PRESENTATION_THEME_MARP: ${{ github.workspace }}/skills/presentation/verification/presentation-themes/node_modules/.bin/marp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/presentation/verification/presentation-themes/package-lock.json

      - name: Install Ghostscript
        run: brew install ghostscript

      - name: Verify browser availability
        run: test -x "$PRESENTATION_THEME_BROWSER"

      - name: Install pinned dependencies
        run: npm ci

      - name: Run HTML, PDF, and gallery acceptance
        run: npm run test:full

      - name: Upload acceptance reports
        if: always()
        id: acceptance-reports
        uses: actions/upload-artifact@v4
        with:
          name: presentation-theme-acceptance-reports
          path: skills/presentation/verification/presentation-themes/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Comment visual review warnings on pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = 'skills/presentation/verification/presentation-themes/reports/acceptance.json';
            const marker = '<!-- presentation-theme-visual-review -->';
            const baseSha = context.payload.pull_request.base.sha;
            const headSha = context.payload.pull_request.head.sha;
            const artifactId = '${{ steps.acceptance-reports.outputs.artifact-id }}';
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${artifactId}`;
            const rawUrl = (sha, path) => `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${sha}/${path}`;
            const baselineUrl = (filename) => rawUrl(baseSha, `skills/presentation/verification/presentation-themes/baselines/${filename}`);
            const galleryArchetypes = { 1: 'title', 3: 'text-only', 4: 'text-plus-image', 5: 'full-image', 6: 'data', 8: 'quotation' };
            const prSampleUrl = (theme, filename) => {
              const slide = Number(filename.match(/slide-(\d+)\.png$/)?.[1]);
              const archetype = galleryArchetypes[slide];
              return archetype ? rawUrl(headSha, `skills/presentation/docs/assets/presentation-themes/${theme}-${archetype}.png`) : null;
            };
            let report;
            try {
              report = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              return;
            }
            const warnings = report.flatMap((theme) => (theme.visualIssues ?? []).map((issue) => {
              const filename = issue.match(/([a-z-]+-(?:html|pdf)-slide-\d+\.png)/)?.[1];
              const baseLink = filename ? `[base image](${baselineUrl(filename)})` : 'base image unavailable';
              const prImage = filename ? prSampleUrl(theme.themeId, filename) : null;
              const headLink = prImage ? `[PR image](${prImage})` : `[PR reports](${artifactUrl})`;
              return `| **${theme.themeId}** | ${filename ?? 'visual check'} | ${baseLink} | ${headLink} | ${issue} |`;
            }));
            const body = warnings.length
              ? `${marker}\n## Presentation theme visual review\n\nAutomated pixel comparisons found potential visual differences for human review. These warnings do not block the PR.\n\n| Theme | Asset | Base branch | PR branch | Finding |\n|---|---|---|---|---|\n${warnings.join('\n')}\n\nThe links open the committed comparison images from each branch. The exact generated HTML/PDF captures and contact sheets are available in the [acceptance artifact](${artifactUrl}) for closer review. Please decide whether the differences are intentional.`
              : `${marker}\n## Presentation theme visual review\n\nNo visual baseline differences were detected.`;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }
