name: Presentation skills

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The skills' shared tool cache, kept between runs so pinned tools download once.
  KEN_GURU_SKILLS_CACHE: ${{ github.workspace }}/.tool-cache

jobs:
  presentation-skills:
    name: presentation-skills
    # A fixed runner image plus the skills' own pinned, checksum-verified tools
    # is the pinned environment the fixture deck renders in.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Restore the pinned tool cache
        uses: actions/cache@v4
        with:
          path: .tool-cache
          key: presentation-skills-tools-${{ runner.os }}-${{ hashFiles('skills/**/scripts/*.mjs', 'skills/**/scripts/marp-cli/package-lock.json') }}

      - name: Install pinned tools
        run: |
          node skills/creating-diagrams/scripts/creating-diagrams.mjs setup
          node skills/creating-charts/scripts/creating-charts.mjs setup
          node skills/presentation/rendering-slides/scripts/rendering-slides.mjs setup

      - name: Validate frontmatter with the official skills-ref
        run: |
          for skill in skills/researching-sources skills/creating-diagrams skills/creating-charts skills/generating-images \
                       skills/presentation/planning-presentation skills/presentation/drafting-slides \
                       skills/presentation/rendering-slides skills/presentation/reviewing-presentation; do
            [ -f "$skill/SKILL.md" ] || continue
            uvx --from "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" skills-ref validate "$skill"
          done

      - name: Check frontmatter, command shape, shared files, and the fixture deck
        env:
          FIXTURE_SLIDES_DIR: ${{ runner.temp }}/fixture-slides
        run: node --test verification/presentation-skills/*.test.mjs

      - name: Test each skill through its command interface
        run: |
          for skill in skills/researching-sources skills/creating-diagrams skills/creating-charts skills/generating-images \
                       skills/presentation/planning-presentation skills/presentation/drafting-slides \
                       skills/presentation/rendering-slides skills/presentation/reviewing-presentation; do
            [ -d "$skill/tests" ] || continue
            node --test "$skill"/tests/*.test.mjs
          done

      - name: Keep the fixture's rendered slides for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-slides
          path: ${{ runner.temp }}/fixture-slides
          if-no-files-found: ignore
