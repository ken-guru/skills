name: Setup devcontainer

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-devcontainer-tool-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect setup-devcontainer changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      setup_devcontainer: ${{ steps.filter.outputs.setup_devcontainer }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect setup-devcontainer changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fail open when there's no usable base to diff against (manual
          # dispatch, a brand-new branch, shallow history) — run the full
          # suite rather than silently skip a required check.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "setup_devcontainer=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "${{ github.sha }}" -- \
              skills/setup-devcontainer \
              skills/setup-claude-devcontainer \
              skills/setup-codex-devcontainer \
              skills/setup-antigravity-devcontainer \
              skills/setup-copilot-devcontainer \
              .github/workflows/setup-devcontainer-tool-container.yml; then
            echo "setup_devcontainer=false" >> "$GITHUB_OUTPUT"
          else
            echo "setup_devcontainer=true" >> "$GITHUB_OUTPUT"
          fi

  tool-container:
    name: Devcontainer render/verify/integration
    needs: changes
    # Always run on a manual dispatch, regardless of what changed. Otherwise, skip
    # the expensive step below when nothing under any of the five devcontainer
    # skills changed — but the job itself must still run and report, since main's
    # ruleset requires this check by name; a workflow-level `paths:` filter would
    # leave it permanently pending on unrelated PRs instead of skipping cleanly.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.setup_devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run render/verify across every ssh x git-defaults combination
        run: skills/setup-devcontainer/scripts/tests/test-devcontainer.sh

      - name: Run patch-if-absent.sh subcommand tests
        run: skills/setup-devcontainer/scripts/tests/test-patch-if-absent.sh

      - name: Run patch-json-array-if-absent.sh (Capability Seam) idempotency tests
        run: skills/setup-devcontainer/scripts/tests/test-patch-json-array-if-absent.sh

      - name: Run end-to-end integration check across all four CLI skills
        run: skills/setup-devcontainer/scripts/tests/test-integration.sh

      - name: Run Shared Container security-boundary checks
        run: skills/setup-devcontainer/scripts/tests/test-security-boundary.sh
