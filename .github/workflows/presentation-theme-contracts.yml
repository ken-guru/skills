name: Presentation theme contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-theme-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect presentation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      presentation: ${{ steps.filter.outputs.presentation }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect presentation changes
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Fail open (treat as a presentation change) for anything we don't
          # know how to diff, or a push with no real prior commit to diff
          # against (new branch, history rewrite) — better to run the full
          # suite unnecessarily than to silently skip it.
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            echo "presentation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "presentation=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$changed_files"

          if echo "$changed_files" | grep -qE '^(skills/presentation/|\.github/workflows/presentation-theme-contracts\.yml$)'; then
            echo "presentation=true" >> "$GITHUB_OUTPUT"
          else
            echo "presentation=false" >> "$GITHUB_OUTPUT"
          fi

  contracts:
    name: Presentation theme contracts
    needs: changes
    # Always run on a manual dispatch, regardless of what changed. Otherwise, skip
    # the expensive steps below when nothing under skills/presentation/** changed —
    # but the job itself must still run and report, since main's ruleset requires
    # this check by name; a workflow-level `paths:` filter would leave it
    # permanently pending on unrelated PRs instead of skipping cleanly.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.presentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: skills/presentation/verification/presentation-themes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            skills/presentation/verification/presentation-themes/package-lock.json
            skills/presentation/generate-images/scripts/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Install image generator build dependencies
        run: npm ci
        working-directory: skills/presentation/generate-images/scripts

      - name: Verify reproducible image generator bundle
        run: npm run check:bundle
        working-directory: skills/presentation/generate-images/scripts

      - name: Run contract and documentation tests
        run: npm test
