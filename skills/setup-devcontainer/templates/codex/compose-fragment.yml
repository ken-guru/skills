  codex:
    image: {{REPO_NAME}}-codex:{{BASE_IMAGE_VERSION}}
    env_file:
      - .env
    environment:
      CODEX_HOME: /home/vscode/.codex
    # Codex's Linux sandbox uses Bubblewrap, which needs to create an
    # unprivileged user namespace — these settings satisfy Docker's own
    # default seccomp/OCI policy for doing that inside an already-
    # containerized environment, scoped to Codex's own service only (no
    # other Tool Container's service carries this grant). This is not
    # bubblewrap's own stated minimum requirement: bubblewrap's modern
    # (non-setuid) mode doesn't itself need SYS_ADMIN — Docker's default
    # seccomp profile is what gates clone/unshare/mount behind that
    # capability at container-creation time. A narrower grant (a custom
    # seccomp allowlist instead of `unconfined`, dropping SYS_ADMIN once
    # that allowlist exists) is plausible but unverified by any primary
    # source as of this writing — not changed here without empirical
    # testing against Codex's actual sandboxed command set, since a wrong
    # guess would silently break the sandbox rather than fail loudly. See
    # README.baseline.md's "CLI installer notes" section for the
    # reader-facing version of this.
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - systempaths=unconfined
    volumes:
      - {{REPO_NAME}}-codex-checkout:/workspace
      - {{REPO_NAME}}-codex-config:/home/vscode/.codex
    command: sleep infinity
