name: Presentation rendered acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-theme-rendering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rendered-acceptance:
    name: Presentation rendered acceptance
    # The bundled macOS fonts keep local and CI rendering representative for human review.
    runs-on: macos-15
    timeout-minutes: 20

    defaults:
      run:
        working-directory: skills/presentation/verification/presentation-themes

    env:
      PRESENTATION_THEME_BROWSER: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      PRESENTATION_THEME_MARP: ${{ github.workspace }}/skills/presentation/verification/presentation-themes/node_modules/.bin/marp

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/presentation/verification/presentation-themes/package-lock.json

      - name: Install Ghostscript
        run: brew install ghostscript

      - name: Verify browser availability
        run: test -x "$PRESENTATION_THEME_BROWSER"

      - name: Install pinned dependencies
        run: npm ci

      - name: Run HTML, PDF, and gallery acceptance
        run: npm run test:full

      - name: Upload acceptance reports
        if: always()
        id: acceptance-reports
        uses: actions/upload-artifact@v4
        with:
          name: presentation-theme-acceptance-reports
          path: skills/presentation/verification/presentation-themes/reports/
          if-no-files-found: ignore
          retention-days: 7
