name: Presentation theme contracts

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-theme-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect presentation changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      presentation: ${{ steps.filter.outputs.presentation }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect presentation changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Fail open when there's no usable base to diff against (manual
          # dispatch, a brand-new branch, shallow history) — run the full
          # suite rather than silently skip a required check.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "presentation=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "${{ github.sha }}" -- skills/presentation .github/workflows/presentation-theme-contracts.yml; then
            echo "presentation=false" >> "$GITHUB_OUTPUT"
          else
            echo "presentation=true" >> "$GITHUB_OUTPUT"
          fi

  contracts:
    name: Presentation theme contracts
    needs: changes
    # Always run on a manual dispatch, regardless of what changed. Otherwise, skip
    # the expensive steps below when nothing under skills/presentation/** changed —
    # but the job itself must still run and report, since main's ruleset requires
    # this check by name; a workflow-level `paths:` filter would leave it
    # permanently pending on unrelated PRs instead of skipping cleanly.
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.presentation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: skills/presentation/verification/presentation-themes

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            skills/presentation/verification/presentation-themes/package-lock.json
            skills/presentation/generate-images/scripts/package-lock.json

      - name: Install pinned dependencies
        run: npm ci

      - name: Install image generator build dependencies
        run: npm ci
        working-directory: skills/presentation/generate-images/scripts

      - name: Verify reproducible image generator bundle
        run: npm run check:bundle
        working-directory: skills/presentation/generate-images/scripts

      - name: Run contract and documentation tests
        run: npm test

      # Generate Diagrams' end-to-end tests run the real D2 CLI; the render
      # contract is pinned to this version and archive checksum.
      - name: Install D2 0.7.1
        env:
          D2_VERSION: 0.7.1
          D2_SHA256: eb172adf59f38d1e5a70ab177591356754ffaf9bebb84e0ca8b767dfb421dad7
        run: |
          archive="$RUNNER_TEMP/d2.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
          echo "${D2_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/d2-v${D2_VERSION}/bin" >> "$GITHUB_PATH"
        working-directory: ${{ github.workspace }}

      - name: Check D2 version
        run: d2 --version | grep -Fx 0.7.1
        working-directory: ${{ github.workspace }}

      # Skill-owned tests resolve paths from the repository root.
      - name: Run Skill-owned tests
        run: node --test skills/presentation/*/tests/*.test.mjs
        working-directory: ${{ github.workspace }}
